[Engine]
; Paths can be absolute (C:\...) or relative to this folder.
qemu=engine\qemu\qemu-system-x86_64.exe
qemu_img=engine\qemu\qemu-img.exe
disk=images\android9.img
disk_format=qcow2
adb=adb\adb.exe

[Emulator]
; RAM in MB (512 - 32768). 4096 is a good default.
ram_mb=4096
; CPU cores (1 - 32). 4 is a good default.
cores=4
; Hardware acceleration. whpx:tcg = "use Windows Hypervisor Platform if
; available, otherwise fall back to software mode" (same trick the paid
; emulators use, but free and open). Do not change unless you know why.
accel=whpx:tcg
; QEMU CPU model. "max" = fastest for the chosen accelerator.
cpu=max
; Use your GPU (NVIDIA/AMD/Intel) to draw the emulator window via OpenGL.
; 1 = on (default, smooth), 0 = off (safe mode if window looks broken).
gpu=1
; Audio backend: dsound (default). Set to "none" if QEMU errors on audio.
audio=dsound
